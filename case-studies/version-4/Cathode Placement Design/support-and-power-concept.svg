<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
<title id="title">Removable cathode support and conceptual DC polarity</title><desc id="desc">Side section of removable cathode plates suspended from an insulated support above the tank and isolated functional polarity schematic.</desc>
<style>text{font-family:Arial,sans-serif;fill:#17324a}.title{font-size:28px;font-weight:bold}.head{font-size:21px;font-weight:bold}.label{font-size:17px}.small{font-size:14px}.tank{fill:#f8fafb;stroke:#315a70;stroke-width:4}.bath{fill:#cce9f0}.metal{fill:#d99a32;stroke:#704f1b;stroke-width:3}.rack{fill:#7991a1;stroke:#334f60;stroke-width:3}.ins{fill:#e7dff0;stroke:#795c90;stroke-width:2}.box{fill:#f2f7fa;stroke:#315a70;stroke-width:3}.red{stroke:#b94735;stroke-width:5;fill:none}.black{stroke:#29343a;stroke-width:5;fill:none}.arrow{marker-end:url(#ar)}.warn{fill:#fff1e9;stroke:#bd573c;stroke-width:2}</style><defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8z" fill="#315a70"/></marker></defs>
<text class="title" x="40" y="46">Support and functional DC concept</text><text class="small" x="40" y="75">Schematic only • exact members and conductors require qualified engineering</text>
<text class="head" x="55" y="130">Removable bridge / header over tank</text><rect class="tank" x="65" y="220" width="780" height="340" rx="5"/><rect class="bath" x="73" y="300" width="764" height="252"/><line x1="73" y1="300" x2="837" y2="300" stroke="#39849b" stroke-width="3"/><rect class="ins" x="120" y="185" width="100" height="35"/><rect class="ins" x="690" y="185" width="100" height="35"/><rect x="110" y="165" width="700" height="22" fill="#4b6b7e"/><rect class="metal" x="190" y="188" width="34" height="300"/><rect class="metal" x="690" y="188" width="34" height="300"/><rect class="rack" x="405" y="245" width="70" height="250"/><text class="label" x="385" y="520">work rack (+)</text><text class="label" x="102" y="520">cathode (−)</text><text class="label" x="690" y="520">cathode (−)</text><text class="small" x="240" y="160">accessible header; keep joints dry, above bath</text><path d="M105 573H330V541" class="black arrow"/><text class="small" x="90" y="600">Tank/rim support only after load verification</text>
<rect class="box" x="915" y="150" width="420" height="390" rx="10"/><text class="head" x="950" y="195">Rectifier concept</text><rect x="1010" y="230" width="230" height="90" rx="8" fill="#e6edf2" stroke="#315a70" stroke-width="3"/><text class="label" x="1040" y="266">DC rectifier</text><text class="small" x="1040" y="294">24 V / 2000 A OR</text><text class="small" x="1050" y="313">30 V / 1000 A</text><path d="M1040 320V375H970V420" class="black arrow"/><path d="M1210 320V375H1280V420" class="red arrow"/><rect x="930" y="420" width="110" height="60" rx="6" fill="#f0e3c8" stroke="#7e5c24" stroke-width="2"/><text class="small" x="944" y="457">cathodes −</text><rect x="1225" y="420" width="95" height="60" rx="6" fill="#dbe5ea" stroke="#355567" stroke-width="2"/><text class="small" x="1244" y="457">rack +</text><text class="small" x="950" y="510">Confirm nameplate, duty, polarity and protections.</text>
<rect class="warn" x="915" y="570" width="420" height="78" rx="8"/><text class="small" x="935" y="600">Do not parallel/combine supplies or infer wiring</text><text class="small" x="935" y="624">from this sketch. Qualified electrician/process engineer only.</text><text class="small" x="40" y="690">Never allow energized cathodes/rack to contact the vessel, other conductors or each other. Apply facility isolation, guarding and emergency controls.</text></svg>
