<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="660" viewBox="0 0 1400 660" role="img" aria-labelledby="title desc">
<title id="title">Tank dimensions and nominal volume</title><desc id="desc">Plan and cross-section with given dimensions, liquid levels, freeboard and calculated volume.</desc>
<style>text{font-family:Arial,sans-serif;fill:#17324a}.title{font-size:29px;font-weight:bold}.head{font-size:21px;font-weight:bold}.label{font-size:17px}.small{font-size:14px}.tank{fill:#f8fafb;stroke:#315a70;stroke-width:4}.bath{fill:#cce9f0;stroke:#39849b;stroke-width:2}.line{stroke:#315a70;stroke-width:2}.dim{stroke:#315a70;stroke-width:2;marker-start:url(#a);marker-end:url(#a)}.dash{stroke:#39849b;stroke-width:2;stroke-dasharray:8 6}</style><defs><marker id="a" markerWidth="10" markerHeight="8" refX="5" refY="4" orient="auto-start-reverse"><path d="M10 0L0 4L10 8" fill="none" stroke="#315a70" stroke-width="1.5"/></marker></defs>
<text class="title" x="40" y="46">Stated vessel envelope and liquid volume check</text>
<text class="head" x="70" y="104">Plan • internal dimensions assumed</text><rect class="tank" x="100" y="140" width="760" height="190"/><line class="dim" x1="100" y1="365" x2="860" y2="365"/><text class="label" x="405" y="395">17.5 ft (5.334 m)</text><line class="dim" x1="900" y1="140" x2="900" y2="330"/><text class="label" x="915" y="240">2.5 ft</text><text class="small" x="382" y="240">2.5 ft internal width</text><text class="small" x="105" y="124">No internal obstruction volume included</text>
<text class="head" x="70" y="465">Cross-section</text><rect class="tank" x="165" y="485" width="520" height="125"/><rect class="bath" x="169" y="506" width="512" height="100"/><line class="dash" x1="169" y1="506" x2="681" y2="506"/><line class="dim" x1="715" y1="485" x2="715" y2="610"/><text class="label" x="730" y="555">3.0 ft tank</text><line class="dim" x1="130" y1="506" x2="130" y2="610"/><text class="label" x="38" y="558">2.5 ft liquid</text><text class="small" x="400" y="500">nominal 6 in freeboard</text>
<rect x="850" y="445" width="500" height="180" rx="10" fill="#f1f7fa" stroke="#315a70" stroke-width="2"/><text class="head" x="875" y="483">Volume check</text><text class="label" x="875" y="520">17.5 × 2.5 × 2.5 ft = 109.375 ft³</text><text class="label" x="875" y="550">= about 3,098 L gross at stated liquid depth</text><text class="label" x="875" y="580">3,000 L corresponds to about 29.05 in liquid depth</text><text class="small" x="40" y="645">Confirm measured inside dimensions, calibrated level/volume table, displacement, operating level, and safe freeboard before filling.</text></svg>
