<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="940" viewBox="0 0 1500 940" role="img" aria-labelledby="title desc">
<title id="title">Cathode placement alternatives in the long anodizing tank</title><desc id="desc">Four schematic top views: opposed long-side banks, segmented opposed banks, opposed banks with a conditional center bank, and end banks. Not to scale.</desc>
<style>text{font-family:Arial,sans-serif;fill:#17324a}.title{font-size:30px;font-weight:bold}.head{font-size:22px;font-weight:bold}.label{font-size:17px}.small{font-size:14px}.tank{fill:#eaf5f8;stroke:#244e63;stroke-width:4}.cath{fill:#d99a32;stroke:#6a4b1d;stroke-width:2}.rack{fill:#7d94a2;stroke:#344e5c;stroke-width:2}.dim{stroke:#385b70;stroke-width:2}.warn{fill:#fff1e9;stroke:#bd573c;stroke-width:2}</style>
<text class="title" x="40" y="48">Cathode placement concepts | 17.5 ft × 2.5 ft tank</text><text class="small" x="40" y="76">Top views • schematic • not to scale • final geometry follows load, bath and approved process</text>
<g transform="translate(45,120)"><text class="head" x="0" y="0">A. Opposed long-side banks</text><rect class="tank" x="0" y="28" width="650" height="190" rx="6"/><rect class="cath" x="20" y="45" width="610" height="24"/><rect class="cath" x="20" y="177" width="610" height="24"/><rect class="rack" x="230" y="101" width="190" height="42" rx="5"/><text class="label" x="253" y="128">work rack</text><text class="small" x="32" y="64">cathode bank</text><text class="small" x="32" y="195">cathode bank</text><text class="small" x="10" y="245">Preferred feasibility baseline; confirm symmetry and clearances.</text></g>
<g transform="translate(795,120)"><text class="head" x="0" y="0">B. Segmented opposed banks</text><rect class="tank" x="0" y="28" width="650" height="190" rx="6"/><g class="cath"><rect x="18" y="45" width="194" height="24"/><rect x="228" y="45" width="194" height="24"/><rect x="438" y="45" width="194" height="24"/><rect x="18" y="177" width="194" height="24"/><rect x="228" y="177" width="194" height="24"/><rect x="438" y="177" width="194" height="24"/></g><rect class="rack" x="230" y="101" width="190" height="42" rx="5"/><text class="label" x="253" y="128">work rack</text><text class="small" x="0" y="245">Serviceable modules; electrical continuity and load balance require review.</text></g>
<g transform="translate(45,500)"><text class="head" x="0" y="0">C. Opposed banks + center bank</text><rect class="tank" x="0" y="28" width="650" height="190" rx="6"/><rect class="cath" x="20" y="45" width="610" height="24"/><rect class="cath" x="20" y="177" width="610" height="24"/><rect class="cath" x="260" y="81" width="24" height="118"/><rect class="rack" x="340" y="101" width="175" height="42" rx="5"/><text class="label" x="360" y="128">work rack</text><rect class="warn" x="0" y="232" width="650" height="56" rx="6"/><text class="small" x="14" y="255">Conditional: can obstruct hoist, flow and maintenance.</text><text class="small" x="14" y="275">Use only if load mapping justifies it.</text></g>
<g transform="translate(795,500)"><text class="head" x="0" y="0">D. End banks</text><rect class="tank" x="0" y="28" width="650" height="190" rx="6"/><rect class="cath" x="18" y="48" width="24" height="150"/><rect class="cath" x="608" y="48" width="24" height="150"/><rect class="rack" x="220" y="101" width="210" height="42" rx="5"/><text class="label" x="243" y="128">work rack</text><text class="small" x="0" y="245">Special case only; verify full-length current distribution.</text></g>
<text class="small" x="40" y="890">All alternatives require confirmed polarity, material, active area, spacing, support load path and qualified process/electrical review.</text></svg>
