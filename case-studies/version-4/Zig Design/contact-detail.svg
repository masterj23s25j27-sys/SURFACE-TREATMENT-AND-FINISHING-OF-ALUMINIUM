<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
<title id="title">Conceptual workpiece contact and lifting interface</title><desc id="desc">Functional diagram of an insulated handling beam, conductive rack beam, replaceable contact finger and workpiece with positive polarity, alongside verification checklist.</desc>
<style>text{font-family:Arial,sans-serif;fill:#17324a}.title{font-size:29px;font-weight:bold}.head{font-size:21px;font-weight:bold}.label{font-size:17px}.small{font-size:14px}.metal{fill:#6c8796;stroke:#2f4c5b;stroke-width:3}.ins{fill:#e7dff0;stroke:#795c90;stroke-width:2}.part{fill:#d5e1e6;stroke:#526e7c;stroke-width:3}.contact{fill:#d99a32;stroke:#704f1b;stroke-width:3}.wire{stroke:#b94735;stroke-width:5;fill:none;marker-end:url(#a)}.box{fill:#f2f7fa;stroke:#315a70;stroke-width:2}.warn{fill:#fff1e9;stroke:#bd573c;stroke-width:2}</style><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8z" fill="#b94735"/></marker></defs>
<text class="title" x="40" y="48">Jig contact and handling interface</text><text class="small" x="40" y="76">Functional concept only • not a clamp drawing • use approved materials and process limits</text>
<rect class="ins" x="170" y="150" width="150" height="60" rx="8"/><text class="label" x="185" y="185">insulated lift</text><rect class="metal" x="95" y="225" width="720" height="42" rx="5"/><text class="label" x="330" y="253">conductive jig / rack beam (+)</text><path d="M400 267V350" stroke="#506f80" stroke-width="16"/><rect class="contact" x="365" y="333" width="70" height="44" rx="5"/><rect class="part" x="390" y="377" width="110" height="220" rx="8"/><text class="label" x="515" y="402">workpiece (+)</text><path class="wire" d="M120 165H40V110H780V250"/><text class="small" x="50" y="98">positive path from approved rectifier output</text><path d="M400 340H490" stroke="#315a70" stroke-width="2"/><text class="small" x="505" y="346">replaceable contact zone</text><path d="M500 485H605" stroke="#315a70" stroke-width="2"/><text class="small" x="615" y="490">part orientation per validated recipe</text><rect class="warn" x="920" y="140" width="420" height="140" rx="8"/><text class="head" x="945" y="180">Isolation and handling</text><text class="small" x="945" y="215">Keep live metal isolated from hoist unless</text><text class="small" x="945" y="239">the hoist/interface is rated for that duty.</text><text class="small" x="945" y="263">Prevent contact with tank and cathodes.</text><rect class="box" x="920" y="320" width="420" height="265" rx="8"/><text class="head" x="945" y="362">Validate each load family</text><text class="label" x="945" y="405">• contact force and repeatability</text><text class="label" x="945" y="443">• contact drop and heating</text><text class="label" x="945" y="481">• load balance, lift and drainage</text><text class="label" x="945" y="519">• coating map and contact marks</text><text class="small" x="40" y="650">Work is positive only for the referenced anodizing convention; confirm the real installation. Qualified staff set acceptance limits.</text></svg>
