<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="940" viewBox="0 0 1500 940" role="img" aria-labelledby="title desc">
<title id="title">Anodizing jig and rack fixture concepts</title><desc id="desc">Four conceptual rack designs for vertical discrete parts, horizontal panels, small parts in a basket, and a dedicated product tree.</desc>
<style>text{font-family:Arial,sans-serif;fill:#17324a}.title{font-size:30px;font-weight:bold}.head{font-size:22px;font-weight:bold}.label{font-size:16px}.small{font-size:14px}.beam{fill:#4f6d7f;stroke:#263f54;stroke-width:3}.part{fill:#d4e0e6;stroke:#526e7c;stroke-width:2}.contact{fill:#d99a32;stroke:#6a4b1d;stroke-width:2}.frame{fill:none;stroke:#506f80;stroke-width:5}.box{fill:#f5f8fa;stroke:#315a70;stroke-width:2}.warn{fill:#fff1e9;stroke:#bd573c;stroke-width:2}</style>
<text class="title" x="40" y="48">Anodizing jig alternatives | long tank envelope</text><text class="small" x="40" y="76">Concepts for load-family selection • not to scale • dimensions and contact details require trials</text>
<g transform="translate(50,115)"><text class="head" x="0" y="0">A. Modular vertical fingers</text><rect class="beam" x="20" y="42" width="590" height="28"/><g class="contact"><rect x="95" y="70" width="16" height="40"/><rect x="230" y="70" width="16" height="40"/><rect x="365" y="70" width="16" height="40"/><rect x="500" y="70" width="16" height="40"/></g><g class="part"><rect x="85" y="110" width="36" height="180"/><rect x="220" y="110" width="36" height="180"/><rect x="355" y="110" width="36" height="180"/><rect x="490" y="110" width="36" height="180"/></g><text class="small" x="10" y="325">Long/tall discrete parts; adjustable positions and replaceable fingers.</text></g>
<g transform="translate(800,115)"><text class="head" x="0" y="0">B. Horizontal crossbars</text><rect class="beam" x="20" y="42" width="590" height="28"/><path class="frame" d="M80 70V275M545 70V275M80 130H545M80 205H545"/><g class="part"><rect x="125" y="139" width="120" height="16"/><rect x="275" y="139" width="120" height="16"/><rect x="125" y="214" width="120" height="16"/><rect x="275" y="214" width="120" height="16"/></g><g class="contact"><rect x="112" y="126" width="20" height="45"/><rect x="262" y="126" width="20" height="45"/><rect x="112" y="201" width="20" height="45"/><rect x="262" y="201" width="20" height="45"/></g><text class="small" x="10" y="325">Panels/profiles; validate sag, drainage, contact marks and shadowing.</text></g>
<g transform="translate(50,510)"><text class="head" x="0" y="0">C. Basket / grid carrier</text><rect class="beam" x="20" y="42" width="590" height="28"/><path class="frame" d="M90 70V260H535V70M90 130H535M90 195H535M200 70V260M315 70V260M425 70V260"/><g fill="#d4e0e6" stroke="#526e7c" stroke-width="2"><circle cx="145" cy="110" r="18"/><circle cx="255" cy="110" r="18"/><circle cx="365" cy="110" r="18"/><circle cx="475" cy="110" r="18"/><circle cx="145" cy="170" r="18"/><circle cx="255" cy="170" r="18"/><circle cx="365" cy="170" r="18"/><circle cx="475" cy="170" r="18"/></g><text class="small" x="10" y="300">Small batches only; contact reliability and solution shadowing are major risks.</text></g>
<g transform="translate(800,510)"><text class="head" x="0" y="0">D. Dedicated product tree</text><rect class="beam" x="20" y="42" width="590" height="28"/><path d="M315 70V270M315 110L150 150M315 110L480 150M315 175L190 215M315 175L440 215" stroke="#506f80" stroke-width="7" fill="none"/><g class="contact"><circle cx="150" cy="150" r="12"/><circle cx="480" cy="150" r="12"/><circle cx="190" cy="215" r="12"/><circle cx="440" cy="215" r="12"/></g><g class="part"><path d="M130 160l20 55 20-55zM460 160l20 55 20-55zM170 225l20 50 20-50zM420 225l20 50 20-50z"/></g><text class="small" x="10" y="300">Repeat geometry; qualify balance, repeatability and product-specific contacts.</text></g>
<rect class="box" x="50" y="860" width="1400" height="48" rx="6"/><text class="small" x="70" y="890">For every option, verify positive work contact, load mass, lift/hoist interface, electrical clearance, drainage, gas release and coating uniformity.</text></svg>
