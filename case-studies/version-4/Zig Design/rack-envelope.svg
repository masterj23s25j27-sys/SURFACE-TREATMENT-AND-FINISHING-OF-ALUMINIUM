<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
<title id="title">Rack envelope and clearances inside the specified tank</title><desc id="desc">Plan and elevation showing the long tank, centered load, cathode banks and hoist clearance envelope, with no final rack dimensions assigned.</desc>
<style>text{font-family:Arial,sans-serif;fill:#17324a}.title{font-size:29px;font-weight:bold}.head{font-size:21px;font-weight:bold}.label{font-size:16px}.small{font-size:14px}.tank{fill:#eaf5f8;stroke:#315a70;stroke-width:4}.cath{fill:#d99a32;stroke:#6a4b1d;stroke-width:2}.rack{fill:#8aa1ae;stroke:#3f5b6c;stroke-width:3}.dash{fill:none;stroke:#3e738b;stroke-width:2;stroke-dasharray:9 7}.arrow{stroke:#315a70;stroke-width:2;marker-end:url(#a)}.warn{fill:#fff1e9;stroke:#bd573c;stroke-width:2}</style><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8z" fill="#315a70"/></marker></defs>
<text class="title" x="40" y="48">Jig envelope and clearance planning</text><text class="small" x="40" y="76">Illustrates 17.5 ft × 2.5 ft tank only • not dimensioned for fabrication</text>
<text class="head" x="55" y="130">Plan view</text><rect class="tank" x="90" y="155" width="900" height="210"/><rect class="cath" x="110" y="172" width="860" height="22"/><rect class="cath" x="110" y="326" width="860" height="22"/><rect class="dash" x="250" y="215" width="580" height="90" rx="8"/><rect class="rack" x="350" y="234" width="380" height="54" rx="6"/><text class="label" x="470" y="269">jig + loaded parts</text><text class="small" x="112" y="190">cathode</text><text class="small" x="112" y="344">cathode</text><text class="small" x="258" y="235">candidate movement envelope</text><text class="small" x="92" y="400">Plan clearance must include parts, rack sway, bath fittings and cathode-to-work spacing.</text>
<text class="head" x="55" y="480">End elevation</text><rect class="tank" x="130" y="510" width="580" height="145"/><rect x="135" y="550" width="570" height="100" fill="#cce9f0"/><rect class="cath" x="180" y="525" width="20" height="110"/><rect class="cath" x="640" y="525" width="20" height="110"/><rect class="rack" x="375" y="540" width="100" height="95"/><line x1="425" y1="455" x2="425" y2="540" stroke="#405c70" stroke-width="6"/><rect x="310" y="435" width="230" height="20" fill="#4f6d7f"/><path class="arrow" d="M780 470V540"/><text class="small" x="790" y="500">hoist path</text><text class="small" x="265" y="675">Keep energized conductors separated from tank and unapproved hoist hardware.</text>
<rect class="warn" x="1030" y="160" width="320" height="320" rx="8"/><text class="head" x="1055" y="202">Set these from survey</text><text class="label" x="1055" y="244">• largest part + rack width</text><text class="label" x="1055" y="282">• immersed height + freeboard</text><text class="label" x="1055" y="320">• cathode gap and active length</text><text class="label" x="1055" y="358">• hoist hook/beam dimensions</text><text class="label" x="1055" y="396">• cooling / circulation envelope</text><text class="label" x="1055" y="434">• load sway and withdrawal path</text><text class="small" x="40" y="695">Do not scale this image. Use verified drawings and an approved dimensional survey.</text></svg>
