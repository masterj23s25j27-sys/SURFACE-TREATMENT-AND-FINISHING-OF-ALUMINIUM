<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-labelledby="title desc">
<title id="title">Version 3 process water and wastewater selection concept</title><desc id="desc">Decision sequence from stream segregation and source reduction to counter-current rinsing, acid recovery, conventional wastewater treatment, membranes, and conditional ZLD with residual management.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#102a43}.h{font-size:29px;font-weight:700}.s{font-size:16px;fill:#475569}.t{font-size:19px;font-weight:700}.b{font-size:15px}.sm{font-size:13px}.box{stroke-width:3;rx:14}.ar{stroke:#334155;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1440" height="850" fill="#f8fafc"/><text x="40" y="52" class="h">Version 3 | Water, recovery and residual treatment options</text><text x="40" y="80" class="s">Segregate first • recover suitable value • treat residuals • close water loops only when quality and waste outlets are proven</text>
<rect x="55" y="140" width="260" height="110" class="box" fill="#e0f2fe" stroke="#0284c7"/><text x="85" y="180" class="t">1. Map streams</text><text x="85" y="210" class="b">Flow + chemistry + permit limits</text>
<rect x="370" y="140" width="260" height="110" class="box" fill="#dcfce7" stroke="#16a34a"/><text x="400" y="180" class="t">2. Reduce source loss</text><text x="400" y="210" class="b">Drain-back • drip shields • rinse controls</text>
<path d="M315 195H365" class="ar"/>
<rect x="685" y="140" width="260" height="110" class="box" fill="#fef3c7" stroke="#d97706"/><text x="715" y="180" class="t">3. Stage rinses</text><text x="715" y="210" class="b">Counter-current • conductivity trends</text>
<path d="M630 195H680" class="ar"/>
<rect x="1000" y="140" width="375" height="110" class="box" fill="#ede9fe" stroke="#7c3aed"/><text x="1030" y="180" class="t">4. Split by recoverable value</text><text x="1030" y="210" class="b">Acid-rich • alkaline • metal-bearing • mixed</text>
<path d="M945 195H995" class="ar"/>
<!-- recovery branch -->
<path d="M1187 250V305H860" class="ar"/><rect x="560" y="300" width="300" height="110" class="box" fill="#f3e8ff" stroke="#9333ea"/><text x="590" y="340" class="t">Recovery pilot</text><text x="590" y="370" class="b">ED / membranes / selected reuse</text><text x="590" y="393" class="sm">Accept only if quality + residual route pass</text>
<rect x="950" y="300" width="385" height="110" class="box" fill="#fff7ed" stroke="#ea580c"/><text x="980" y="340" class="t">5. Residual treatment</text><text x="980" y="370" class="b">Equalize • jar-test • precipitate • clarify</text><text x="980" y="393" class="sm">Filter/polish + lab verification</text><path d="M860 355H945" class="ar"/>
<!-- advanced branches -->
<rect x="100" y="500" width="345" height="140" class="box" fill="#fef2f2" stroke="#dc2626"/><text x="130" y="540" class="t">Advanced treatment pilots</text><text x="130" y="570" class="b">EC / EO / NF / RO / ion exchange</text><text x="130" y="595" class="sm">Not one-size-fits-all; test full matrix</text><text x="130" y="617" class="sm">Concentrate, sulfate and sludge remain</text>
<rect x="550" y="500" width="350" height="140" class="box" fill="#ecfccb" stroke="#65a30d"/><text x="580" y="540" class="t">6. Reuse qualification</text><text x="580" y="570" class="b">Return only to a compatible process stage</text><text x="580" y="595" class="sm">Product quality + bath impurity checks</text><text x="580" y="617" class="sm">Measure water/chemical balance and cost</text>
<path d="M710 410V495" class="ar"/><path d="M560 560H450" class="ar"/>
<rect x="1010" y="500" width="340" height="140" class="box" fill="#e2e8f0" stroke="#475569"/><text x="1040" y="540" class="t">7. Selective near-ZLD</text><text x="1040" y="570" class="b">Only if permit, reuse and economics justify</text><text x="1040" y="595" class="sm">Membrane concentration + evaporation option</text><text x="1040" y="617" class="sm">Secure brine/salt/sludge outlet first</text><path d="M900 570H1005" class="ar"/>
<rect x="180" y="700" width="1080" height="75" class="box" fill="#fffbeb" stroke="#b45309"/><text x="220" y="734" class="t">Every route ends with verified discharge/reuse quality and a documented residual destination</text><text x="348" y="758" class="sm">A no-liquid-discharge claim does not mean no waste, no energy use, or automatic regulatory approval.</text>
<path d="M1178 640V690" class="ar"/><path d="M740 640V690" class="ar"/><path d="M273 640V690" class="ar"/>
</svg>
