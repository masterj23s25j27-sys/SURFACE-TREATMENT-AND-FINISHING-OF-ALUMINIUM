<line x1="380" y1="200" x2="380" y2="385" stroke="#475569" stroke-width="8"/><line x1="430" y1="200" x2="430" y2="385" stroke="#475569" stroke-width="8"/><rect x="354" y="385" width="104" height="173" rx="10" fill="#f4c95d" stroke="#854d0e" stroke-width="4"/><line x1="365" y1="423" x2="448" y2="423" stroke="#854d0e" stroke-width="3"/><line x1="365" y1="462" x2="448" y2="462" stroke="#854d0e" stroke-width="3"/><line x1="365" y1="501" x2="448" y2="501" stroke="#854d0e" stroke-width="3"/><text x="340" y="580" class="tx">Work rack</text>
