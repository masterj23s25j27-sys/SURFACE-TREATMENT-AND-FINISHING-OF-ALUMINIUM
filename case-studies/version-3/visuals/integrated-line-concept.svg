<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">Version 3 integrated anodizing line modernization concept</title>
<desc id="desc">Conceptual process tank with removable cathodes, work rack, busbar and digital sensors, cooling recirculation, hood, staged rinse, recovery and wastewater treatment. Not a verified image or design drawing.</desc>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#102a43}.h{font-size:30px;font-weight:700}.sub{font-size:17px;fill:#475569}.th{font-size:20px;font-weight:700}.tx{font-size:16px}.sm{font-size:13px}.line{fill:none;stroke:#334155;stroke-width:4;marker-end:url(#arr)}.dashed{fill:none;stroke:#64748b;stroke-width:3;stroke-dasharray:9 7}.box{fill:#fff;stroke:#64748b;stroke-width:3}</style></defs>
<rect width="1440" height="900" fill="#f8fafc"/><text x="40" y="50" class="h">Version 3 | Integrated line modernization concept</text><text x="40" y="80" class="sub">Functions to verify and engineer • conceptual only • not to scale • not reconstructed from the video</text>
