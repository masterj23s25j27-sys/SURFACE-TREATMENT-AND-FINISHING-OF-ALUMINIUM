<path d="M65 674H730V704H65Z" fill="#d6b56e" stroke="#8a6a29" stroke-width="3"/><text x="135" y="698" class="sm">Calculated support frame • bund/secondary containment • safe access</text>
<rect x="40" y="835" width="1360" height="42" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="58" y="862" class="sm">Confirm bath chemistry, tank condition, dimensions, rectifier duty, airflow, wastewater lab data and local approvals before selecting equipment.</text>
