<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="350" viewBox="0 0 1100 350"><style>text{font-family:Arial,sans-serif;fill:#17324a}.title{font-size:22px;font-weight:bold}.box{fill:#eef5f8;stroke:#35627c;stroke-width:2}.warn{fill:#fff0e5;stroke:#ad6734;stroke-width:2}.label{font-size:14px}.arrow{stroke:#405f76;stroke-width:3;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#405f76"/></marker></defs><text class="title" x="35" y="38">Conventional Treatment.Svg</text><rect class="box" x="35.0" y="118" width="153.33333333333334" height="92" rx="8"/><text class="label" text-anchor="middle" x="111.66666666666667" y="150">Segregate flows</text><text class="label" text-anchor="middle" x="111.66666666666667" y="176">acid / alkali</text><line class="arrow" x1="191.33333333333334" y1="164.0" x2="206.33333333333334" y2="164.0"/><rect class="box" x="210.33333333333334" y="118" width="153.33333333333334" height="92" rx="8"/><text class="label" text-anchor="middle" x="287.0" y="150">Equalize</text><text class="label" text-anchor="middle" x="287.0" y="176">measure pH, metals</text><line class="arrow" x1="366.6666666666667" y1="164.0" x2="381.6666666666667" y2="164.0"/><rect class="box" x="385.6666666666667" y="118" width="153.33333333333334" height="92" rx="8"/><text class="label" text-anchor="middle" x="462.33333333333337" y="150">Neutralize</text><text class="label" text-anchor="middle" x="462.33333333333337" y="176">precipitate Al</text><line class="arrow" x1="542.0" y1="164.0" x2="557.0" y2="164.0"/><rect class="box" x="561.0" y="118" width="153.33333333333334" height="92" rx="8"/><text class="label" text-anchor="middle" x="637.6666666666666" y="150">Flocculate</text><text class="label" text-anchor="middle" x="637.6666666666666" y="176">condition solids</text><line class="arrow" x1="717.3333333333334" y1="164.0" x2="732.3333333333334" y2="164.0"/><rect class="box" x="736.3333333333334" y="118" width="153.33333333333334" height="92" rx="8"/><text class="label" text-anchor="middle" x="813.0" y="150">Clarify</text><text class="label" text-anchor="middle" x="813.0" y="176">settle solids</text><line class="arrow" x1="892.6666666666667" y1="164.0" x2="907.6666666666667" y2="164.0"/><rect class="box" x="911.6666666666667" y="118" width="153.33333333333334" height="92" rx="8"/><text class="label" text-anchor="middle" x="988.3333333333334" y="150">Polish / monitor</text><text class="label" text-anchor="middle" x="988.3333333333334" y="176">permit limits</text><text class="label" x="35" y="275">Manage concentrated spent baths separately; never assume neutral pH alone means safe discharge.</text><text class="label" x="35" y="310">Conceptual flow only. Confirm with lab data, local discharge limits, and qualified process design.</text></svg>